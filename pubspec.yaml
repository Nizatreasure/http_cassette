name: http_cassette_workspace
description: Workspace tooling for the HTTP Cassette package family.
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'

workspace:
  - packages/http_cassette
  - packages/http_cassette_dio
  - packages/http_cassette_http

dev_dependencies:
  dio: ^5.9.0
  http: ^1.3.0
  http_cassette: ^0.1.0
  http_cassette_dio: ^0.1.0
  http_cassette_http: ^0.1.0
  lints: ^5.1.1
  test: '>=1.25.15 <1.26.0'
